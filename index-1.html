<style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ── DATA ──────────────────────────────────────────────────────────────────
const START = new Date('2026-06-22T00:00:00');
const RACE  = new Date('2027-01-17T00:00:00');

const WPLAN = [
  {tue:'4km Easy Base',          fri:'4km Zone 2 Easy',  sun:'6km'},
  {tue:'4km Easy Base',          fri:'4km Zone 2 Easy',  sun:'8km'},
  {tue:'4km Easy Base',          fri:'4km Zone 2 Easy',  sun:'10km'},
  {tue:'4km Easy Base',          fri:'4km Zone 2 Easy',  sun:'12km'},
  {tue:'6km · 6×400m Intervals', fri:'5km Zone 2 Easy',  sun:'10km'},
  {tue:'6km · 6×400m Intervals', fri:'5km Zone 2 Easy',  sun:'14km'},
  {tue:'6km · 6×400m Intervals', fri:'5km Zone 2 Easy',  sun:'16km'},
  {tue:'6km · 6×400m Intervals', fri:'5km Zone 2 Easy',  sun:'18km'},
  {tue:'6km · 6×400m Intervals', fri:'6km Zone 2 Easy',  sun:'14km — DELOAD'},
  {tue:'6km · 6×400m Intervals', fri:'6km Zone 2 Easy',  sun:'20km'},
  {tue:'8km · 4km Tempo',        fri:'6km Zone 2 Easy',  sun:'22km'},
  {tue:'8km · 4km Tempo',        fri:'6km Zone 2 Easy',  sun:'16km — DELOAD'},
  {tue:'8km · 4km Tempo',        fri:'7km Zone 2 Easy',  sun:'24km'},
  {tue:'8km · 4km Tempo',        fri:'7km Zone 2 Easy',  sun:'20km'},
  {tue:'8km · 4km Tempo',        fri:'7km Zone 2 Easy',  sun:'26km'},
  {tue:'8km · 4km Tempo',        fri:'7km Zone 2 Easy',  sun:'16km — DELOAD'},
  {tue:'10km · 5×1km Repeats',   fri:'8km Zone 2 Easy',  sun:'21.1km 🏅 HALF MARATHON RACE'},
  {tue:'10km · 5×1km Repeats',   fri:'8km Zone 2 Easy',  sun:'18km'},
  {tue:'10km · 5×1km Repeats',   fri:'8km Zone 2 Easy',  sun:'28km'},
  {tue:'10km · 5×1km Repeats',   fri:'8km Zone 2 Easy',  sun:'22km'},
  {tue:'10km · 5×1km Repeats',   fri:'9km Zone 2 Easy',  sun:'30km — PEAK'},
  {tue:'10km · 5×1km Repeats',   fri:'9km Zone 2 Easy',  sun:'24km'},
  {tue:'10km · 5×1km Repeats',   fri:'9km Zone 2 Easy',  sun:'32km — PEAK'},
  {tue:'10km · 5×1km Repeats',   fri:'9km Zone 2 Easy',  sun:'22km'},
  {tue:'12km · 6km @ Goal Pace', fri:'5km Zone 2 Easy',  sun:'34km — FINAL PEAK'},
  {tue:'12km · 6km @ Goal Pace', fri:'5km Zone 2 Easy',  sun:'24km'},
  {tue:'12km · 6km @ Goal Pace', fri:'5km Zone 2 Easy',  sun:'32km'},
  {tue:'5km Taper Easy',         fri:'5km Zone 2 Easy',  sun:'20km'},
  {tue:'5km Taper Easy',         fri:'5km Zone 2 Easy',  sun:'12km'},
  {tue:'5km Taper Easy',         fri:'5km Zone 2 Easy',  sun:'42.2km 🏆 TATA MUMBAI MARATHON'},
];

const PULL = [
  {id:'lat_pull',  name:'Lat Pulldown',        tgt:'3×8-12',  base:15,  max:12, bw:false},
  {id:'seat_row',  name:'Seated Row',           tgt:'3×8-10',  base:15,  max:10, bw:false},
  {id:'rear_delt', name:'Rear Delt Fly',        tgt:'3×12-15', base:5,   max:15, bw:false},
  {id:'bic_curl',  name:'Machine Bicep Curl',   tgt:'3×8-12',  base:5,   max:12, bw:false},
  {id:'ham_curl',  name:'DB Hammer Curl',       tgt:'3×10-12', base:5,   max:12, bw:false},
  {id:'ghd_ext',   name:'GHD Back Extension',   tgt:'3×10-15', base:0,   max:15, bw:true},
];
const LEGS = [
  {id:'sl_press',  name:'Single-Leg Press',     tgt:'3×8-10',  base:10,  max:10, bw:false},
  {id:'leg_ext',   name:'Leg Extensions',       tgt:'3×12-15', base:10,  max:15, bw:false},
  {id:'leg_curl',  name:'Lying Leg Curls',      tgt:'3×10-12', base:10,  max:12, bw:false},
  {id:'calf_r',    name:'Seated Calf Raises',   tgt:'4×12-15', base:15,  max:15, bw:false},
  {id:'tib_r',     name:'Tibialis Raises',      tgt:'3×15-20', base:0,   max:20, bw:true},
  {id:'cap_chair', name:"Captain's Chair",      tgt:'3×Fail',  base:0,   max:99, bw:true},
];
const PUSH = [
  {id:'bench',     name:'Barbell Bench Press',  tgt:'3×6-8',   base:20,  max:8,  bw:false},
  {id:'db_press',  name:'Seated DB Press',      tgt:'3×8-10',  base:5,   max:10, bw:false},
  {id:'chest_fly', name:'Machine Chest Flye',   tgt:'3×12-15', base:15,  max:15, bw:false},
  {id:'lat_raise', name:'Cable Lateral Raises', tgt:'3×12-15', base:2.5, max:15, bw:false},
  {id:'tri_push',  name:'Tricep Pushdowns',     tgt:'3×10-12', base:10,  max:12, bw:false},
];

// ── STORAGE ───────────────────────────────────────────────────────────────
function lkey(w){ return 'sub4_w'+w; }
function load(w){ try{return JSON.parse(localStorage.getItem(lkey(w))||'{}')}catch{return {}} }
function save(w,d){ localStorage.setItem(lkey(w),JSON.stringify(d)); }

// last-viewed-week persistence (so the app opens where you left off, not Week 1)
const LASTWEEK_KEY='sub4_lastweek';
function getLastWeek(){
  const v=parseInt(localStorage.getItem(LASTWEEK_KEY),10);
  return (v>=1 && v<=30) ? v : null;
}
function setLastWeek(w){ localStorage.setItem(LASTWEEK_KEY, w); }

// ── PROGRESSIVE OVERLOAD & AUTOREGULATION ───────────────────────────────────
// Parses "3×8-12" into {sets:3, min:8, max:12}
function parseTarget(tgt){
  const m = tgt.match(/(\d+)×(\d+)-(\d+)/);
  if(!m) return null;
  return {sets:+m[1], min:+m[2], max:+m[3]};
}

// A week counts as "fatigued" if it's a PEAK long-run week on the plan,
// or last week's logged long run was unusually large — gym targets should
// not be pushed harder while running volume/fatigue is high.
function isFatiguedWeek(w){
  const plan = WPLAN[w-1];
  if(!plan) return false;
  if(/PEAK/i.test(plan.sun)) return true;
  if(w>1){
    const prevSun = parseFloat(load(w-1)['run_sun_dist']||'0');
    if(prevSun >= 26) return true;
  }
  return false;
}

// Walks every prior logged week for this exercise and decides this week's
// weight + coaching status:
//  - progress: hit full target reps on all 3 sets -> +2.5kg
//  - plateau:  missed full reps 2+ weeks running (not a true failure) -> hold weight, push reps instead
//  - deload:   reps fell well short of the target (failure) -> -5 to -10% weight
//  - recovery: would have progressed, but running volume this week is high -> hold weight
function analyzeExercise(ex, weekNum){
  if(ex.bw) return {weight:null, text:'BW', status:'bw'};

  const t = parseTarget(ex.tgt);
  let weight = ex.base;
  let missStreak = 0;
  let status = 'progress';

  for(let w=1; w<weekNum; w++){
    const d = load(w);
    const raw1=d[ex.id+'_s1r'], raw2=d[ex.id+'_s2r'], raw3=d[ex.id+'_s3r'];
    if(!raw1 && !raw2 && !raw3) continue; // no data logged that week — don't break streaks on gaps

    const r1=parseInt(raw1||'0',10), r2=parseInt(raw2||'0',10), r3=parseInt(raw3||'0',10);
    const avg=(r1+r2+r3)/3;
    const hitFull = t ? (r1>=t.max && r2>=t.max && r3>=t.max) : false;
    const isFailure = t ? (avg < t.min*0.7) : false; // well below even the bottom of the rep range

    if(hitFull){
      weight += 2.5;
      missStreak = 0;
      status = 'progress';
    } else if(isFailure){
      weight = Math.round((weight*0.925)*2)/2; // ~7.5% deload, rounded to nearest 0.5kg
      missStreak = 0; // fresh attempt after a deload
      status = 'deload';
    } else {
      missStreak++;
      status = missStreak>=2 ? 'plateau' : 'progress';
    }
  }

  // Gym/run balance check — don't load up the very week running fatigue peaks
  if(isFatiguedWeek(weekNum) && status==='progress' && missStreak===0){
    status='recovery';
  }

  let text;
  if(status==='deload')        text = weight+'kg ↓';
  else if(status==='plateau')  text = weight+'kg · +reps';
  else if(status==='recovery') text = weight+'kg · hold';
  else                          text = weight+'kg';

  return {weight, text, status};
}

// ── DATE HELPERS ──────────────────────────────────────────────────────────
function weekStart(w){
  const d=new Date(START); d.setDate(d.getDate()+(w-1)*7); return d;
}
function fmtDate(d){
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function weekDates(w){
  const s=weekStart(w), e=new Date(s); e.setDate(e.getDate()+6);
  return fmtDate(s)+' – '+fmtDate(e)+', '+e.getFullYear();
}
function currentWeek(){
  const t=new Date(); t.setHours(0,0,0,0);
  const diff=Math.floor((t-START)/(7*86400000));
  return Math.max(1,Math.min(30,diff+1));
}
function daysLeft(){
  const t=new Date(); t.setHours(0,0,0,0);
  return Math.max(0,Math.ceil((RACE-t)/86400000));
}
function isToday(dayIdx, w){
  const d=new Date(weekStart(w)); d.setDate(d.getDate()+dayIdx); d.setHours(0,0,0,0);
  const t=new Date(); t.setHours(0,0,0,0);
  return d.getTime()===t.getTime();
}
function dayDate(idx,w){
  const d=new Date(weekStart(w)); d.setDate(d.getDate()+idx); return fmtDate(d);
}
function weekStats(w){
  const d=load(w);
  let runKm=0, runCount=0;
  ['tue','fri','sun'].forEach(slot=>{
    const v=parseFloat(d['run_'+slot+'_dist']);
    if(!isNaN(v) && v>0){ runKm+=v; runCount++; }
  });
  let gymCount=0;
  [PULL,LEGS,PUSH].forEach(grp=>{
    if(d[grp[0].id+'_s1w']!==undefined && d[grp[0].id+'_s1w']!=='') gymCount++;
  });
  return {runKm, runCount, gymCount};
}

// Checks whether this week set a new best (weight × reps) for any exercise
// in the given group, compared against every other logged week.
function checkPRs(w, exercises){
  const d=load(w);
  const prs=[];
  exercises.forEach(ex=>{
    if(ex.bw) return;
    let curBest=0;
    for(let s=1;s<=3;s++){
      const kg=parseFloat(d[ex.id+'_s'+s+'w']||0), rep=parseInt(d[ex.id+'_s'+s+'r']||0,10);
      if(kg && rep) curBest=Math.max(curBest, kg*rep);
    }
    if(!curBest) return;
    let histBest=0;
    for(let pw=1; pw<=30; pw++){
      if(pw===w) continue;
      const pd=load(pw);
      for(let s=1;s<=3;s++){
        const kg=parseFloat(pd[ex.id+'_s'+s+'w']||0), rep=parseInt(pd[ex.id+'_s'+s+'r']||0,10);
        if(kg && rep) histBest=Math.max(histBest, kg*rep);
      }
    }
    if(histBest>0 && curBest>histBest) prs.push(ex.name);
  });
  return prs;
}

function sv(w,tag){
  let prMsg='';
  if(tag.startsWith('gym')){
    const i=parseInt(tag.replace('gym',''),10);
    const group = i===2?PULL : i===3?LEGS : i===5?PUSH : null;
    if(group){
      const prs=checkPRs(w,group);
      if(prs.length) prMsg=' 🏆 PR: '+prs.join(', ')+'!';
    }
  }
  toast(prMsg ? '🏆 New PR!' : '✓ Session saved');
  if(navigator.vibrate) navigator.vibrate(prMsg ? [40,40,40] : 15);
  const el=document.getElementById('sm_'+tag+'_'+w);
  if(el){
    el.textContent='✓ Saved!'+prMsg;
    el.className = prMsg ? 'savedmsg prtoast' : 'savedmsg';
    el.style.display='block';
    setTimeout(()=>{ el.style.display='none'; el.textContent='✓ Saved!'; el.className='savedmsg'; },3500);
  }
}

// ── PROGRESS CHART (Chart.js) ───────────────────────────────────────────────
// Shows weight AND reps together so you can see exactly what weight you were
// lifting and how many reps you got at that weight, week by week.
let chartInst=null;
function getProgressSeries(exId){
  const labels=[], weights=[], reps=[], setDetail=[];
  for(let w=1; w<=30; w++){
    const d=load(w);
    const ws=[d[exId+'_s1w'],d[exId+'_s2w'],d[exId+'_s3w']]
      .map(v=>parseFloat(v)).filter(v=>!isNaN(v));
    const rs=[d[exId+'_s1r'],d[exId+'_s2r'],d[exId+'_s3r']]
      .map(v=>parseInt(v||'0',10));
    const hasReps = rs.some(v=>v>0);
    labels.push('W'+w);
    weights.push(ws.length ? Math.max(...ws) : null);
    reps.push(hasReps ? Math.round((rs.reduce((a,b)=>a+b,0)/3)*10)/10 : null);
    setDetail.push(hasReps ? rs : null);
  }
  return {labels,weights,reps,setDetail};
}
function showProgressChart(exId, exName){
  const {labels,weights,reps,setDetail}=getProgressSeries(exId);
  document.getElementById('chartTitle').textContent=exName+' — 30-Week Progression';
  openModal('chartModal');
  const ctx=document.getElementById('progressCanvas').getContext('2d');
  if(chartInst) chartInst.destroy();
  chartInst=new Chart(ctx,{
    type:'line',
    data:{labels, datasets:[
      {
        label:'Weight (kg)', data:weights, yAxisID:'y',
        borderColor:'#e74c3c', backgroundColor:'rgba(231,76,60,0.15)',
        spanGaps:true, tension:0.25, pointRadius:3, fill:true
      },
      {
        label:'Avg Reps', data:reps, yAxisID:'y1',
        borderColor:'#4a90d9', backgroundColor:'rgba(74,144,217,0.1)',
        spanGaps:true, tension:0.25, pointRadius:3, borderDash:[4,3], fill:false
      }
    ]},
    options:{
      responsive:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:true, position:'bottom', labels:{color:'#aaa',font:{size:9},boxWidth:10}},
        tooltip:{
          callbacks:{
            afterBody:(items)=>{
              const idx=items[0].dataIndex;
              const sd=setDetail[idx];
              return sd ? ['Sets: '+sd.map(r=>r+' reps').join(' · ')] : ['No data logged'];
            }
          }
        }
      },
      scales:{
        x:{ticks:{color:'#777',font:{size:8}},grid:{color:'#1f1f1f'}},
        y:{
          position:'left',
          ticks:{color:'#e74c3c',font:{size:9}},
          grid:{color:'#1f1f1f'},
          title:{display:true,text:'kg',color:'#e74c3c',font:{size:9}}

        }
      }
    }
  });
}

// ── AI COACH (Gemini) ────────────────────────────────────────────────────────
// MODEL NOTE: gemini-1.5-flash was fully discontinued (404s) before this was
// written. gemini-2.5-flash is solid, fast, and free-tier eligible — good
// default for this app. If you enable billing later and want the deepest
// possible reasoning for health/training analysis, swap this constant to
// 'gemini-3.1-pro' (paid-tier only, noticeably slower, noticeably smarter).
const GEMINI_MODEL = 'gemini-2.5-flash';

// NOTE ON SECURITY: this app is a single static HTML file with no backend, so
// there is no way to call a paid API without the key living somewhere the
// browser can read. Storing it in localStorage (never committed to the repo)
// means it's only ever readable on this device, not by visitors to your
// public GitHub Pages URL. If you ever want stronger protection, route this
// fetch through a small serverless proxy (e.g. a Cloudflare Worker) that
// holds the key server-side instead.
const GEMINI_KEY_LS='sub4_gemini_key';
function getApiKey(){ return localStorage.getItem(GEMINI_KEY_LS)||''; }
function setApiKeyPrompt(){
  const cur=getApiKey();
  const k=prompt('Enter your Gemini API key (stored only in this browser, on this device).\n\nGet one free at aistudio.google.com/app/apikey — sign in, click "Create API key", copy it here:', cur||'');
  if(k!==null){
    localStorage.setItem(GEMINI_KEY_LS,k.trim());
    toast(k.trim() ? '✓ API key saved' : '✓ API key cleared');
  }
}

function buildWeekSummary(w){
  const d=load(w);
  const plan=WPLAN[w-1];
  const lines=[`Week ${w} of 30.`];

  ['tue','fri','sun'].forEach(slot=>{
    const dist=d['run_'+slot+'_dist'], pace=d['run_'+slot+'_pace'], hr=d['run_'+slot+'_hr'];
    if(dist) lines.push(`${slot.toUpperCase()} run — target: ${plan[slot]}, actual: ${dist}km${pace?' @ '+pace:''}${hr?', HR '+hr+'bpm':''}`);
  });

  const ALL=[...PULL,...LEGS,...PUSH];
  ALL.forEach(ex=>{
    const r1=d[ex.id+'_s1r'], r2=d[ex.id+'_s2r'], r3=d[ex.id+'_s3r'];
    const w1=d[ex.id+'_s1w'];
    if(r1||r2||r3){
      lines.push(`${ex.name} (target ${ex.tgt}): ${w1||'BW'}kg × [${r1||'-'},${r2||'-'},${r3||'-'}] reps`);
    }
  });

  if(d.bw) lines.push(`Bodyweight: ${d.bw}kg`);
  if(d.week_notes) lines.push(`Notes: ${d.week_notes}`);
  return lines.join('\n');
}

async function callGemini(prompt, key){
  const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
  });
  const json=await res.json();
  return {status:res.status, json};
}

async function askCoach(){
  const key=getApiKey();
  if(!key){ setApiKeyPrompt(); return; }

  openModal('coachModal');
  const body=document.getElementById('coachBody');
  body.innerHTML='<div class="coach-loading">🤖 Analyzing Week '+CW+'…</div>';

  const summary=buildWeekSummary(CW);
  const prompt=`Act as a professional Ironman 70.3 coach. Analyze my data: ${summary}. Detect any performance plateaus, compare my running fatigue against my gym performance, and provide 1-2 sentences of specific advice to either push harder or prioritize recovery.`;

  try{
    let {status, json} = await callGemini(prompt, key);

    // Free-tier model overload (503) is transient — retry once after a short pause
    if(status===503){
      body.innerHTML='<div class="coach-loading">🤖 Coach is busy, retrying…</div>';
      await new Promise(r=>setTimeout(r,2500));
      ({status, json} = await callGemini(prompt, key));
    }

    if(status===401 || status===403){
      throw new Error('Your API key was rejected. Tap ⚙ and re-paste it — make sure there are no extra spaces, and that it was created at aistudio.google.com/app/apikey.');
    }
    if(status===429){
      throw new Error("You've hit Gemini's free-tier rate limit (requests per minute/day). Wait a minute and try again.");
    }
    if(status===503){
      throw new Error("Gemini's servers are overloaded right now even after a retry. This is on Google's end — wait a minute and try again.");
    }
    if(json.error) throw new Error(json.error.message || ('API error '+status));

    const text=json.candidates?.[0]?.content?.parts?.[0]?.text;
    body.textContent = text || 'The coach had no advice this time — try again after logging more sets.';
  }catch(err){
    body.innerHTML = `<div style="color:#e76a6a;font-size:12px">⚠ Couldn't reach the AI coach.<br><br>${(err.message||'Unknown error')}</div>`;
  }
}

  const ALL=[...PULL,...LEGS,...PUSH];
  let rows=[['Week','Dates','Exercise/Field','Set','Value']];
  for(let w=1;w<=30;w++){
    const d=load(w);
    if(!Object.keys(d).length)continue;
    const dates=weekDates(w);
    // runs
    ['tue','fri','sun'].forEach(slot=>{
      ['dist','pace','hr','time','notes'].forEach(f=>{
        const v=d['run_'+slot+'_'+f];
        if(v)rows.push([w,dates,'RUN_'+slot.toUpperCase(),f,v]);
      });
    });
    // gym
    ALL.forEach(ex=>{
      for(let s=1;s<=3;s++){
        const kg=d[ex.id+'_s'+s+'w'], rep=d[ex.id+'_s'+s+'r'];
        if(kg||rep)rows.push([w,dates,ex.name,'Set'+s,(kg||'-')+'kg × '+(rep||'-')+'reps']);
      }
    });
    if(d.bw)rows.push([w,dates,'Bodyweight','kg',d.bw]);
    if(d.week_notes)rows.push([w,dates,'Weekly Notes','—',d.week_notes]);
  }
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='Sub4_Export_'+new Date().toISOString().split('T')[0]+'.csv';
  a.click();
  toast('⬇ Export downloaded');
}

// ── SWIPE GESTURE (mobile week nav) ─────────────────────────────────────────
let touchStartX=null;
(function(){
  const m=document.getElementById('main');
  m.addEventListener('touchstart',e=>{ touchStartX=e.touches[0].clientX; },{passive:true});
  m.addEventListener('touchend',e=>{
    if(touchStartX===null) return;
    const dx=e.changedTouches[0].clientX-touchStartX;
    if(Math.abs(dx)>70) changeWeek(dx<0?1:-1);
    touchStartX=null;
  },{passive:true});
})();

// ── PWA INSTALL (icon.png on home screen + offline support) ──────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────
render();
</script>
