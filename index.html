<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>SUB-4 LOGBOOK</title>
<style>
:root{--r:#e74c3c;--rd:#c0392b;--rdim:rgba(231,76,60,0.13);--bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;--b:#2a2a2a;--t:#f0f0f0;--m:#777}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:sans-serif}
.hdr{padding:20px;background:var(--bg2);border-bottom:1px solid var(--b)}
.hdr-title{font-size:18px;font-weight:700;color:var(--r);letter-spacing:2px}
.main{padding:20px}
.card{background:var(--bg2);border:1px solid var(--b);border-radius:10px;padding:15px;margin-bottom:15px}
.exname{font-weight:600;display:block}
.exsug{font-size:12px;color:var(--r);font-weight:700}
.sinprow{display:flex;gap:5px;margin-top:5px}
.sinp{background:var(--bg3);border:1px solid var(--b);color:var(--t);padding:8px;width:60px;border-radius:4px}
.savebtn{width:100%;background:var(--r);color:#fff;border:none;padding:12px;border-radius:6px;margin-top:10px;cursor:pointer}
</style>
</head>
<body>

<div class="hdr"><div class="hdr-title">⚡ SUB-4 LOGBOOK</div></div>

<div class="main" id="main"></div>

<script>
const START = new Date('2026-06-22T00:00:00');
const PULL = [
  {id:'lat_pull', name:'Lat Pulldown', tgt:'3×8-12', base:15, max:12, bw:false},
  {id:'seat_row', name:'Seated Row',   tgt:'3×8-10', base:15, max:10, bw:false}
];

function load(w){ try{return JSON.parse(localStorage.getItem('sub4_w'+w)||'{}')}catch{return {}} }
function save(w,d){ localStorage.setItem('sub4_w'+w,JSON.stringify(d)); }

function suggested(ex, weekNum){
  if(ex.bw) return 'BW';
  let successCount = 0;
  for(let w=1; w<weekNum; w++){
    const d = load(w);
    const r1 = parseInt(d[ex.id+'_s1r']||'0');
    const r2 = parseInt(d[ex.id+'_s2r']||'0');
    const r3 = parseInt(d[ex.id+'_s3r']||'0');
    if(r1>=ex.max && r2>=ex.max && r3>=ex.max) successCount++;
  }
  return (ex.base + (successCount * 2.5)) + 'kg';
}

function render(){
  const w = 1; // Example for Week 1
  const data = load(w);
  let html = '<h3>Week 1 Gym</h3>';
  PULL.forEach(ex => {
    html += `<div class="card">
      <span class="exname">${ex.name}</span>
      <span class="exsug">Suggested: ${suggested(ex, w)}</span>
      <div class="sinprow">
        <input class="sinp" type="number" placeholder="kg" id="${ex.id}_s1w" value="${data[ex.id+'_s1w']||''}" oninput="as('${ex.id}_s1w',this.value,${w})">
        <input class="sinp" type="number" placeholder="reps" id="${ex.id}_s1r" value="${data[ex.id+'_s1r']||''}" oninput="as('${ex.id}_s1r',this.value,${w})">
      </div>
      <button class="savebtn" onclick="alert('Saved!')">SAVE</button>
    </div>`;
  });
  document.getElementById('main').innerHTML = html;
}

function as(key,val,w){ const d=load(w); d[key]=val; save(w,d); }
render();
</script>
</body>
</html>
